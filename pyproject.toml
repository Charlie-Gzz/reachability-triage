[project]
name = "reachability-triage"
version = "0.2.0"
description = "Agentic reachability triage and test-first remediation for dependency vulnerabilities"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pyyaml>=6.0",
    "packaging>=24",
    "pydantic>=2.7",
    "langgraph>=0.2",
    "chromadb>=0.5",
    "faiss-cpu>=1.8",
    "sentence-transformers>=3.0",
    "numpy>=1.26",
    "httpx>=0.27",
    "matplotlib>=3.8",
    "plotly>=5.20",
]

[project.scripts]
rt = "reachability_triage.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.5", "playwright>=1.44"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reachability_triage"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["bench", "workdirs", ".work", "runs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "E741", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
