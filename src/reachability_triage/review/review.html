<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sieve · Label review</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root { --bg:#0B0F17; --panel:#131A26; --border:#1F2937; --text:#E5E7EB; --muted:#9CA3AF; --accent:#A78BFA;
          --red:#EF4444; --green:#22C55E; --amber:#F59E0B; --cyan:#38BDF8; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.55 Inter, system-ui, sans-serif; }
  code, pre, .mono { font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 13px; }
  header { display:flex; align-items:center; gap:14px; padding:14px 24px; border-bottom:1px solid var(--border); }
  header .brand { font-weight:700; letter-spacing:.2px; }
  header .brand span { color:var(--accent); }
  .progress { flex:1; height:6px; background:var(--panel); border-radius:3px; overflow:hidden; }
  .progress > div { height:100%; background:var(--accent); transition:width .2s; }
  .count { color:var(--muted); font-size:13px; white-space:nowrap; }
  main { max-width:1100px; margin:0 auto; padding:20px 24px 140px; display:grid; grid-template-columns: 1fr 1fr; gap:16px; }
  .panel { background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:16px 18px; min-width:0; }
  .wide { grid-column: 1 / -1; }
  h2 { margin:0 0 4px; font-size:18px; }
  h3 { margin:0 0 10px; font-size:12px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); font-weight:600; }
  .meta { color:var(--muted); font-size:13px; display:flex; flex-wrap:wrap; gap:6px 14px; }
  .pill { display:inline-block; padding:2px 10px; border-radius:999px; font-size:12px; font-weight:600; border:1px solid currentColor; }
  .reachable { color:var(--red); } .not_reachable { color:var(--green); } .uncertain { color:var(--amber); }
  .reviewed { color:var(--cyan); }
  pre { white-space:pre-wrap; word-break:break-word; margin:0; max-height:340px; overflow:auto; color:#D1D5DB; }
  ul { margin:6px 0 0; padding-left:18px; } li { margin:2px 0; }
  a { color:var(--accent); }
  .bar { position:fixed; left:0; right:0; bottom:0; background:rgba(11,15,23,.96); border-top:1px solid var(--border);
         padding:12px 24px; display:flex; gap:10px; align-items:center; flex-wrap:wrap; justify-content:center; }
  button { font:600 14px Inter, sans-serif; padding:10px 16px; border-radius:10px; border:1px solid var(--border);
           background:var(--panel); color:var(--text); cursor:pointer; }
  button:hover { border-color:var(--accent); }
  button kbd { font-family:"JetBrains Mono", monospace; font-size:11px; color:var(--muted); margin-left:6px; }
  button.confirm { background:var(--accent); color:#0B0F17; border-color:var(--accent); }
  button.confirm kbd { color:#2e1065; }
  textarea { width:min(420px, 100%); height:42px; background:var(--panel); color:var(--text); border:1px solid var(--border);
             border-radius:10px; padding:8px 10px; font:13px Inter, sans-serif; resize:vertical; }
  .nav { color:var(--muted); font-size:12px; }
  .saved { color:var(--cyan); font-size:13px; min-width:70px; }
  @media (max-width: 760px) { main { grid-template-columns: 1fr; padding:16px 16px 220px; } header { padding:12px 16px; } }
</style>
</head>
<body>
<header>
  <div class="brand">Sieve <span>· label review</span></div>
  <div class="progress"><div id="prog" style="width:0"></div></div>
  <div class="count" id="count"></div>
</header>
<main id="main"><div class="panel wide">Loading…</div></main>
<div class="bar">
  <span class="nav">← → move · <kbd>J</kbd> next pending</span>
  <button class="confirm" data-act="confirm">Confirm draft<kbd>C</kbd></button>
  <button data-act="reachable">Reachable<kbd>R</kbd></button>
  <button data-act="not_reachable">Not reachable<kbd>N</kbd></button>
  <button data-act="uncertain">Uncertain<kbd>U</kbd></button>
  <textarea id="notes" placeholder="Notes (optional)"></textarea>
  <span class="saved" id="saved"></span>
</div>
<script>
let items = [], i = 0;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pill = l => `<span class="pill ${l}">${l.replace("_"," ")}</span>`;

function render() {
  const reviewed = items.filter(x => x.label.status === "reviewed").length;
  $("#prog").style.width = (100 * reviewed / Math.max(items.length, 1)) + "%";
  $("#count").textContent = `${reviewed} / ${items.length} reviewed · #${i + 1}`;
  const it = items[i]; if (!it) return;
  const f = it.finding, L = it.label, a = it.advisory, ev = L.draft_evidence || {};
  $("#notes").value = L.notes || "";
  $("#main").innerHTML = `
  <section class="panel wide">
    <h2 class="mono">${esc(f.finding_id)}</h2>
    <div class="meta"><span>${esc(f.package)}==${esc(f.version)}</span><span>${f.direct_dependency ? "direct" : "transitive"} dependency</span>
      <span>CVSS ${esc(f.max_cvss || "n/a")}</span><span>fixed in ${esc((f.fixed_versions || []).join(", ") || "n/a")}</span>
      <span>status ${L.status === "reviewed" ? '<span class="pill reviewed">reviewed</span>' : "pending"}</span></div>
  </section>
  <section class="panel">
    <h3>Drafted label</h3>
    <div style="font-size:20px;margin-bottom:8px">${pill(L.label)} ${L.label !== L.drafted_label ? `<span class="nav">(draft was ${esc(L.drafted_label)})</span>` : ""}</div>
    <div>${esc(L.draft_rule)}</div>
    <h3 style="margin-top:14px">Symbols searched</h3><div class="mono">${esc((L.draft_symbols || []).join(", ") || "none")}</div>
    <h3 style="margin-top:14px">Imports (${ev.import_count ?? 0})</h3>
    <ul class="mono">${(ev.imports || []).map(x => `<li>${esc(x)}</li>`).join("") || "<li>none in first-party code</li>"}</ul>
    <h3 style="margin-top:14px">Symbol hits (${ev.symbol_hit_count ?? 0})</h3>
    <ul class="mono">${(ev.symbol_hits || []).map(h => `<li>${esc(h.location)} <b>${esc(h.symbol)}</b><br><span style="color:#9CA3AF">${esc(h.line)}</span></li>`).join("") || "<li>none</li>"}</ul>
  </section>
  <section class="panel">
    <h3>Advisory ${esc(a.id)}</h3>
    <div style="font-weight:600;margin-bottom:6px">${esc(a.summary)}</div>
    <div class="nav">affected: ${esc((a.affected || []).join("; "))}</div>
    <pre style="margin-top:10px">${esc(a.details)}</pre>
    <ul>${(a.references || []).map(u => `<li><a href="${esc(u)}" target="_blank" rel="noopener">${esc(u)}</a></li>`).join("")}</ul>
  </section>`;
}

async function save(act) {
  const it = items[i]; if (!it) return;
  const label = act === "confirm" ? it.label.drafted_label : act;
  const r = await fetch("/api/label", {method: "POST", headers: {"Content-Type": "application/json"},
    body: JSON.stringify({finding_id: it.finding.finding_id, label, notes: $("#notes").value})});
  if (!r.ok) { $("#saved").textContent = "error"; return; }
  it.label = await r.json();
  $("#saved").textContent = "saved ✓"; setTimeout(() => $("#saved").textContent = "", 900);
  nextPending();
}
function nextPending() {
  for (let k = 1; k <= items.length; k++) {
    const j = (i + k) % items.length;
    if (items[j].label.status !== "reviewed") { i = j; render(); return; }
  }
  render();
}
document.querySelectorAll("button[data-act]").forEach(b => b.onclick = () => save(b.dataset.act));
document.addEventListener("keydown", e => {
  if (e.target.tagName === "TEXTAREA") return;
  const k = e.key.toLowerCase();
  if (k === "c") save("confirm"); else if (k === "r") save("reachable");
  else if (k === "n") save("not_reachable"); else if (k === "u") save("uncertain");
  else if (k === "arrowright") { i = Math.min(i + 1, items.length - 1); render(); }
  else if (k === "arrowleft") { i = Math.max(i - 1, 0); render(); }
  else if (k === "j") nextPending();
});
fetch("/api/items").then(r => r.json()).then(d => {
  items = d; const p = items.findIndex(x => x.label.status !== "reviewed"); i = p < 0 ? 0 : p; render();
});
</script>
</body>
</html>
